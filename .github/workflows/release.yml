name: Release Harak

# ينشئ GitHub Release بالحزمة المبنية عند دفع وسمٍ مثل v1.0.0
# (أو يدوياً من تبويب Actions بإدخال اسم الوسم).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: zip -r harak-v1.0.zip dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" harak-v1.0.zip --clobber
          else
            gh release create "$TAG" harak-v1.0.zip --title "حَراك v1.0" --notes-file docs/HANDOFF.md
          fi
